plat: spacemit

# Upstream U-Boot 2026.07 + OpenSBI port for the SpacemiT K3 (X100).
# Source paths are relative to the bootloader workspace root, or absolute.

opensbi:
  src: opensbi
  platform: generic
  # The upstream generic defconfig already enables CONFIG_PLATFORM_SPACEMIT_K3.
  defconfig: defconfig

uboot:
  src: u-boot
  defconfig: k3_defconfig
  defconfig_fragments: k3_android.config

android:
  binaries_path: vendor/rise/spacemit/k3/bootloader

# Factory-mode key injection is disabled for development images.
secure:
  avb: false
